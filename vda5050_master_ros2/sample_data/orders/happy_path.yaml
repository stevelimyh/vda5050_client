# Happy-path 2-node order: AGV walks N0 (0,0) → N1 (5,0).
# Uses the 4-node grid from sample_map.json. Edge E1 is bidirectional
# (matches the map), so this works for any AGV starting at N0.
#
# Default identity: Manufacturer/S001. To target a different AGV:
#   sed 's/Manufacturer/MyMfg/g; s/S001/MyS001/g' happy_path.yaml | ros2 service call ...
manufacturer: 'Manufacturer'
serial_number: 'S001'
order:
  header:
    header_id: 0
    timestamp: 0
    version: '2.0.0'
    manufacturer: 'Manufacturer'
    serial_number: 'S001'
  order_id: 'sample-happy-path'
  order_update_id: 0
  zone_set_id: []
  nodes:
    - {node_id: 'N0', sequence_id: 0, released: true, actions: [],
       node_description: [],
       node_position: [{x: 0.0, y: 0.0, theta: [0.0],
                        allowed_deviation_x_y: [0.5],
                        allowed_deviation_theta: [0.1],
                        map_id: 'warehouse_floor1',
                        map_description: []}]}
    - {node_id: 'N1', sequence_id: 2, released: true, actions: [],
       node_description: [],
       node_position: [{x: 5.0, y: 0.0, theta: [0.0],
                        allowed_deviation_x_y: [0.5],
                        allowed_deviation_theta: [0.1],
                        map_id: 'warehouse_floor1',
                        map_description: []}]}
  edges:
    - {edge_id: 'E1', sequence_id: 1, start_node_id: 'N0', end_node_id: 'N1',
       released: true, actions: [], edge_description: [],
       max_speed: [1.0], length: [5.0],
       max_height: [], min_height: [],
       orientation: [], orientation_type: [],
       direction: [], rotation_allowed: [], max_rotation_speed: [],
       trajectory: []}
